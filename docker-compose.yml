services:
  compiler-arduino:
    platform: linux/amd64
    build:
      context: ./compilers
      dockerfile: arduino.Dockerfile
    image: cubot/arduino-compiler:latest
    profiles: ["build-compilers"]

  compiler-arm:
    platform: linux/amd64
    build:
      context: ./compilers
      dockerfile: arm.Dockerfile
    image: cubot/ti-arm-compiler:latest
    profiles: ["build-compilers"]

  mongodb:
    image: mongo:7.0
    container_name: cubot-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cubot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cubot_secret}
      MONGO_INITDB_DATABASE: cubot_ide
    volumes:
      - mongodb_data:/data/db
    networks:
      - cubot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cubot-backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER:-cubot}:${MONGO_PASSWORD:-cubot_secret}@mongodb:27017/cubot_ide?authSource=admin
      - ALLOWED_ORIGINS=http://localhost,https://${DOMAIN:-localhost}
      - COMPILE_WORKDIR=/compile_tmp
      - COMPILE_WORKDIR_HOST=${COMPILE_HOST_DIR:-/opt/cubot/compiles}
      - DD_AGENT_HOST=datadog
      - DD_SERVICE=cubot-backend
      - DD_ENV=${DD_ENV:-production}
      - DD_VERSION=${DD_VERSION:-1.0.0}
      - DD_TRACE_ANALYTICS_ENABLED=true
      - DD_LOGS_INJECTION=true
      # ROS sandbox pods: kubeconfig written by scripts/setup-k3s.sh
      - KUBECONFIG=/kube/config
      # CAD Studio: geometry runs in the sandboxed cad-worker service
      - CAD_WORKER_URL=http://cad-worker:8100
      - CAD_STORAGE_DIR=/data/cad
      - FLEET_MQTT_WS_URL=wss://${DOMAIN:-localhost}/mqtt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_GID:-984}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPILE_HOST_DIR:-/opt/cubot/compiles}:/compile_tmp
      - ${KUBE_CONFIG_DIR:-/opt/cubot/kube}:/kube:ro
      - cad_data:/data/cad
    depends_on:
      - mongodb
      - cad-worker
    networks:
      - cubot-network
      - cad-internal

  # Runs model-written CadQuery code. Same image as the backend, but with no
  # Docker socket, no secrets, a read-only filesystem, no outbound network
  # (cad-internal is internal-only) and capped memory/CPU.
  cad-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cubot-cad-worker
    restart: unless-stopped
    command: [".venv/bin/uvicorn", "services.cad.server:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      - CAD_WORKERS=${CAD_WORKERS:-1}
      - CAD_JOB_TIMEOUT=60
      - CAD_WORKER_MAX_JOBS=100
    volumes:
      - cad_data:/data/cad
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CAD_WORKER_MEMORY:-900m}
    cpus: 1.5
    pids_limit: 128
    networks:
      - cad-internal

  fleet-broker:
    image: eclipse-mosquitto:2
    container_name: cubot-fleet-broker
    restart: unless-stopped
    ports:
      - "1893:1883"
      - "127.0.0.1:9011:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - fleet_broker_data:/mosquitto/data
    networks:
      - cubot-network

  fleet-coordinator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cubot-fleet-coordinator
    restart: unless-stopped
    command: [".venv/bin/python", "-m", "services.fleet.coordinator"]
    env_file: backend/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER:-cubot}:${MONGO_PASSWORD}@mongodb:27017/cubot_ide?authSource=admin
      - FLEET_MQTT_HOST=fleet-broker
      - FLEET_MQTT_PORT=1883
    depends_on:
      - mongodb
      - fleet-broker
    networks:
      - cubot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_WS_URL=ws://${DOMAIN:-localhost}
        - NEXT_PUBLIC_FLEET_MQTT_URL=wss://${DOMAIN:-localhost}/mqtt
    container_name: cubot-frontend
    restart: unless-stopped
    env_file: frontend/.env.local
    environment:
      - DD_AGENT_HOST=datadog
      - DD_SERVICE=cubot-frontend
      - DD_ENV=${DD_ENV:-production}
      - DD_VERSION=${DD_VERSION:-1.0.0}
    depends_on:
      - backend
    networks:
      - cubot-network

  datadog:
    image: registry.datadoghq.com/agent:7
    container_name: dd-agent
    restart: unless-stopped
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.eu}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE=name:dd-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - cubot-network

  nginx:
    image: nginx:alpine
    container_name: cubot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - fleet-broker
    networks:
      - cubot-network

volumes:
  mongodb_data:
  cad_data:
  fleet_broker_data:

networks:
  cubot-network:
    driver: bridge
  cad-internal:
    driver: bridge
    internal: true
