services:
  mongodb:
    image: mongo:7.0
    container_name: cubot-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cubot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cubot_secret}
      MONGO_INITDB_DATABASE: cubot_ide
    volumes:
      - mongodb_data:/data/db
    networks:
      - cubot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cubot-backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER:-cubot}:${MONGO_PASSWORD:-cubot_secret}@mongodb:27017/cubot_ide?authSource=admin
      - ALLOWED_ORIGINS=http://localhost,https://${DOMAIN:-localhost}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mongodb
    networks:
      - cubot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: cubot-frontend
    restart: unless-stopped
    env_file: frontend/.env.local
    environment:
      - NEXTAUTH_URL=https://${DOMAIN:-localhost}
    depends_on:
      - backend
    networks:
      - cubot-network

  nginx:
    image: nginx:alpine
    container_name: cubot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cubot-network

volumes:
  mongodb_data:

networks:
  cubot-network:
    driver: bridge
