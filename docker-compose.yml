services:
  compiler-arduino:
    build:
      context: ./compilers
      dockerfile: arduino.Dockerfile
    image: cubot/arduino-compiler:latest
    profiles: ["build-compilers"]

  compiler-arm:
    build:
      context: ./compilers
      dockerfile: arm.Dockerfile
    image: cubot/ti-arm-compiler:latest
    profiles: ["build-compilers"]

  mongodb:
    image: mongo:7.0
    container_name: cubot-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cubot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cubot_secret}
      MONGO_INITDB_DATABASE: cubot_ide
    volumes:
      - mongodb_data:/data/db
    networks:
      - cubot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cubot-backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER:-cubot}:${MONGO_PASSWORD:-cubot_secret}@mongodb:27017/cubot_ide?authSource=admin
      - ALLOWED_ORIGINS=http://localhost,https://${DOMAIN:-localhost}
      - COMPILE_WORKDIR=/compile_tmp
      - COMPILE_WORKDIR_HOST=${COMPILE_HOST_DIR:-/opt/cubot/compiles}
      - DD_AGENT_HOST=datadog
      - DD_SERVICE=cubot-backend
      - DD_ENV=${DD_ENV:-production}
      - DD_VERSION=${DD_VERSION:-1.0.0}
      - DD_TRACE_ANALYTICS_ENABLED=true
      - DD_LOGS_INJECTION=true
    group_add:
      - "${DOCKER_GID:-984}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPILE_HOST_DIR:-/opt/cubot/compiles}:/compile_tmp
    depends_on:
      - mongodb
    networks:
      - cubot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_WS_URL=ws://${DOMAIN:-localhost}
    container_name: cubot-frontend
    restart: unless-stopped
    env_file: frontend/.env.local
    environment:
      - DD_AGENT_HOST=datadog
      - DD_SERVICE=cubot-frontend
      - DD_ENV=${DD_ENV:-production}
      - DD_VERSION=${DD_VERSION:-1.0.0}
    depends_on:
      - backend
    networks:
      - cubot-network

  datadog:
    image: registry.datadoghq.com/agent:7
    container_name: dd-agent
    restart: unless-stopped
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.eu}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE=name:dd-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - cubot-network

  nginx:
    image: nginx:alpine
    container_name: cubot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cubot-network

volumes:
  mongodb_data:

networks:
  cubot-network:
    driver: bridge
