name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Cancel in-flight deployments when a newer push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ───────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/cubot/backend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/cubot/backend:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/backend:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/backend:cache,mode=max

      # ── Frontend ──────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_WS_URL=wss://${{ secrets.DOMAIN }}
          tags: |
            ${{ env.ECR_REGISTRY }}/cubot/frontend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/cubot/frontend:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/frontend:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/frontend:cache,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DOMAIN: ${{ secrets.DOMAIN }}
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          COMPILE_HOST_DIR: ${{ secrets.COMPILE_HOST_DIR }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ secrets.DD_SITE }}
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")

          # Values derived from secrets stay empty when a secret is missing,
          # so the env merge below keeps what the server already has.
          MONGODB_URI=""
          if [ -n "$MONGO_USER" ] && [ -n "$MONGO_PASSWORD" ]; then
            MONGODB_URI="mongodb://$MONGO_USER:$MONGO_PASSWORD@mongodb:27017/cubot_ide?authSource=admin"
          fi
          SITE_URL=""
          if [ -n "$DOMAIN" ]; then SITE_URL="https://$DOMAIN"; fi

          # Build the deploy script on the runner.
          # All variables below are runner env vars, expanded by the unquoted heredoc.
          cat > /tmp/deploy.sh << RUNNER_EOF
          #!/bin/bash
          set -euo pipefail
          cd /home/ubuntu/cubot-ide

          # ── ECR login ────────────────────────────────────────
          echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          # ── Pull latest configs from repo ─────────────────────
          # Run as ubuntu so git uses its SSH key (SSM executes as root by default)
          sudo -u ubuntu -H git fetch origin main && sudo -u ubuntu -H git reset --hard origin/main

          # ── Update env files ──────────────────────────────────
          # Only the keys listed below are written; every other line (e.g. a
          # MONGODB_URI added by hand on the server) is kept. A key whose value
          # is empty here (secret not set in GitHub) keeps its current value.
          merge_env() {
            local target=\$1 updates=\$2
            mkdir -p "\$(dirname "\$target")"
            touch "\$target"
            cp -p "\$target" "\$target.bak"
            awk '
              NR == FNR {
                i = index(\$0, "=")
                if (i > 1 && i < length(\$0)) { k = substr(\$0, 1, i - 1); val[k] = substr(\$0, i + 1); order[++n] = k }
                next
              }
              {
                i = index(\$0, "=")
                k = i > 1 ? substr(\$0, 1, i - 1) : ""
                if (k in val) { if (!(k in done)) print k "=" val[k]; done[k] = 1 } else print
              }
              END { for (j = 1; j <= n; j++) if (!(order[j] in done)) print order[j] "=" val[order[j]] }
            ' "\$updates" "\$target" > "\$target.tmp"
            cat "\$target.tmp" > "\$target"
            rm -f "\$target.tmp" "\$updates"
          }

          cat > /tmp/root.env << 'EC2_EOF'
          DOMAIN=$DOMAIN
          MONGO_USER=$MONGO_USER
          MONGO_PASSWORD=$MONGO_PASSWORD
          COMPILE_HOST_DIR=$COMPILE_HOST_DIR
          AWS_REGION=$AWS_REGION
          ECR_REGISTRY=$ECR_REGISTRY
          IMAGE_TAG=$IMAGE_TAG
          DD_API_KEY=$DD_API_KEY
          DD_SITE=$DD_SITE
          DD_ENV=production
          DD_VERSION=$IMAGE_TAG
          EC2_EOF
          echo "DOCKER_GID=\$(getent group docker | cut -d: -f3)" >> /tmp/root.env
          merge_env .env /tmp/root.env

          cat > /tmp/backend.env << 'EC2_EOF'
          MONGODB_URI=$MONGODB_URI
          MONGODB_DB_NAME=cubot_ide
          AWS_REGION=$AWS_REGION
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          BEDROCK_MODEL_ID=$BEDROCK_MODEL_ID
          SECRET_KEY=$SECRET_KEY
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          ALLOWED_ORIGINS=$SITE_URL
          COMPILE_WORKDIR=/compile_tmp
          COMPILE_WORKDIR_HOST=$COMPILE_HOST_DIR
          DD_AGENT_HOST=datadog
          DD_SERVICE=cubot-backend
          DD_ENV=production
          DD_VERSION=$IMAGE_TAG
          DD_TRACE_ANALYTICS_ENABLED=true
          DD_LOGS_INJECTION=true
          EC2_EOF
          merge_env backend/.env /tmp/backend.env

          cat > /tmp/frontend.env << 'EC2_EOF'
          NEXT_PUBLIC_API_URL=/api
          NEXTAUTH_URL=$SITE_URL
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          DD_AGENT_HOST=datadog
          DD_SERVICE=cubot-frontend
          DD_ENV=production
          DD_VERSION=$IMAGE_TAG
          EC2_EOF
          merge_env frontend/.env.local /tmp/frontend.env

          # ── k3s cluster for ROS sandbox pods (idempotent; installs on first run) ──
          bash scripts/setup-k3s.sh

          # ── Remove any standalone dd-agent container (replaced by compose service) ──
          docker rm -f dd-agent 2>/dev/null || true

          # ── Make room before pulling ──────────────────────────
          # The backend image is about 2 GB and the disk is 19 GB. Images no container
          # uses go first (the running ones stay), so the pull never fills the disk and
          # takes the SSM agent down with it. The journal is capped the same way.
          docker image prune -a -f --filter "until=1h" --filter "label!=cubot.keep=true"
          journalctl --vacuum-size=200M >/dev/null 2>&1 || true
          echo "Disk before pull: \$(df -h / | awk 'NR==2 {print \$4 " free"}')"

          # ── Deploy ────────────────────────────────────────────
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --parallel backend frontend
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

          # ── Reload nginx to pick up any config changes ─────────
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload || true

          # ── Cleanup old images (including old tagged ECR images) ─
          docker image prune -a -f --filter "until=1h" --filter "label!=cubot.keep=true"

          # ── Compiler images are built on the host, not pulled: build any that are missing ─
          for svc in compiler-arduino compiler-arm; do
            img=\$(docker compose --profile build-compilers config --format json 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['services']['\$svc']['image'])")
            if ! docker image inspect "\$img" >/dev/null 2>&1; then
              echo "Building missing \$img"
              docker compose --profile build-compilers build "\$svc"
            fi
          done

          echo "Deploy complete: \$(date) — image $IMAGE_TAG"
          RUNNER_EOF

          # Send the script to EC2 via SSM (jq handles JSON escaping of the script content)
          COMMAND_ID=$(aws ssm send-command \
            --instance-id "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 900 \
            --parameters "$(jq -n --rawfile script /tmp/deploy.sh '{commands: [$script]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to finish. `aws ssm wait command-executed`
          # gives up after ~100 s whatever AWS_MAX_ATTEMPTS says, so poll the
          # status ourselves: every 15 s for up to 15 min (the SSM timeout).
          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2> /dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 15 ;;
              *) break ;;
            esac
          done
          echo "SSM command status: $STATUS"

          echo "::group::Remote stdout"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "::endgroup::"

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed ($STATUS) — stderr:"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
