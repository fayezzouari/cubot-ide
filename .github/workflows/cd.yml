name: CD

on:
  push:
    branches: [main]

# Cancel in-flight deployments when a newer push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ───────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/cubot/backend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/cubot/backend:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/backend:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/backend:cache,mode=max

      # ── Frontend ──────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_WS_URL=wss://${{ secrets.DOMAIN }}
          tags: |
            ${{ env.ECR_REGISTRY }}/cubot/frontend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/cubot/frontend:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/frontend:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/frontend:cache,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Write .env files and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: |
            AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }},
            AWS_REGION=${{ secrets.AWS_REGION }},
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }},
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }},
            DOMAIN=${{ secrets.DOMAIN }},
            MONGO_USER=${{ secrets.MONGO_USER }},
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }},
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }},
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},
            AWS_BEDROCK_MODEL_ID=${{ secrets.AWS_BEDROCK_MODEL_ID }},
            DAYTONA_API_KEY=${{ secrets.DAYTONA_API_KEY }},
            SECRET_KEY=${{ secrets.SECRET_KEY }},
            COMPILE_HOST_DIR=${{ secrets.COMPILE_HOST_DIR }},
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/cubot-ide

            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            # ── Write root .env ──────────────────────────────────
            cat > .env <<EOF
            DOMAIN=${DOMAIN}
            MONGO_USER=${MONGO_USER}
            MONGO_PASSWORD=${MONGO_PASSWORD}
            COMPILE_HOST_DIR=${COMPILE_HOST_DIR}
            AWS_REGION=${AWS_REGION}
            ECR_REGISTRY=${ECR_REGISTRY}
            IMAGE_TAG=${IMAGE_TAG}
            EOF

            # ── Write backend/.env ───────────────────────────────
            mkdir -p backend
            cat > backend/.env <<EOF
            MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/cubot_ide?authSource=admin
            MONGODB_DB_NAME=cubot_ide
            AWS_REGION=${AWS_REGION}
            AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            BEDROCK_MODEL_ID=${AWS_BEDROCK_MODEL_ID}
            DAYTONA_API_KEY=${DAYTONA_API_KEY}
            SECRET_KEY=${SECRET_KEY}
            ALLOWED_ORIGINS=https://${DOMAIN}
            COMPILE_WORKDIR=/compile_tmp
            COMPILE_WORKDIR_HOST=${COMPILE_HOST_DIR}
            EOF

            # ── Write frontend/.env.local ────────────────────────
            mkdir -p frontend
            cat > frontend/.env.local <<EOF
            NEXT_PUBLIC_API_URL=/api
            NEXTAUTH_URL=https://${DOMAIN}
            NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            EOF

            # ── ECR login ────────────────────────────────────────
            AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID} \
            AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY} \
            aws ecr get-login-password --region ${AWS_REGION} | \
              docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            # ── Pull latest configs from repo ────────────────────
            git fetch origin main && git reset --hard origin/main

            # ── Deploy ───────────────────────────────────────────
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --remove-orphans

            # ── Cleanup old images ───────────────────────────────
            docker system prune -f --filter "until=24h"

            echo "Deploy complete: $(date) — image ${IMAGE_TAG}"
