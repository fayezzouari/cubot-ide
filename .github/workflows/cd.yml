name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Cancel in-flight deployments when a newer push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ───────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/cubot/backend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/cubot/backend:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/backend:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/backend:cache,mode=max

      # ── Frontend ──────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_WS_URL=wss://${{ secrets.DOMAIN }}
          tags: |
            ${{ env.ECR_REGISTRY }}/cubot/frontend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/cubot/frontend:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/frontend:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/cubot/frontend:cache,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DOMAIN: ${{ secrets.DOMAIN }}
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          COMPILE_HOST_DIR: ${{ secrets.COMPILE_HOST_DIR }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BEDROCK_MODEL_ID: ${{ secrets.AWS_BEDROCK_MODEL_ID }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ secrets.DD_SITE }}
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")

          # Build the deploy script on the runner.
          # All variables below are runner env vars, expanded by the unquoted heredoc.
          cat > /tmp/deploy.sh << RUNNER_EOF
          #!/bin/bash
          set -euo pipefail
          cd /home/ubuntu/cubot-ide

          # ── ECR login ────────────────────────────────────────
          echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          # ── Pull latest configs from repo ─────────────────────
          # Run as ubuntu so git uses its SSH key (SSM executes as root by default)
          sudo -u ubuntu -H git fetch origin main && sudo -u ubuntu -H git reset --hard origin/main

          # ── Write root .env ───────────────────────────────────
          cat > .env << 'EC2_EOF'
          DOMAIN=$DOMAIN
          MONGO_USER=$MONGO_USER
          MONGO_PASSWORD=$MONGO_PASSWORD
          COMPILE_HOST_DIR=$COMPILE_HOST_DIR
          AWS_REGION=$AWS_REGION
          ECR_REGISTRY=$ECR_REGISTRY
          IMAGE_TAG=$IMAGE_TAG
          DD_API_KEY=$DD_API_KEY
          DD_SITE=$DD_SITE
          DD_ENV=production
          DD_VERSION=$IMAGE_TAG
          EC2_EOF

          # ── Write backend/.env ────────────────────────────────
          mkdir -p backend
          cat > backend/.env << 'EC2_EOF'
          MONGODB_URI=mongodb://$MONGO_USER:$MONGO_PASSWORD@mongodb:27017/cubot_ide?authSource=admin
          MONGODB_DB_NAME=cubot_ide
          AWS_REGION=$AWS_REGION
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          BEDROCK_MODEL_ID=$AWS_BEDROCK_MODEL_ID
          DAYTONA_API_KEY=$DAYTONA_API_KEY
          SECRET_KEY=$SECRET_KEY
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          ALLOWED_ORIGINS=https://$DOMAIN
          COMPILE_WORKDIR=/compile_tmp
          COMPILE_WORKDIR_HOST=$COMPILE_HOST_DIR
          DD_AGENT_HOST=datadog
          DD_SERVICE=cubot-backend
          DD_ENV=production
          DD_VERSION=$IMAGE_TAG
          DD_TRACE_ANALYTICS_ENABLED=true
          DD_LOGS_INJECTION=true
          EC2_EOF

          # ── Write frontend/.env.local ─────────────────────────
          mkdir -p frontend
          cat > frontend/.env.local << 'EC2_EOF'
          NEXT_PUBLIC_API_URL=/api
          NEXTAUTH_URL=https://$DOMAIN
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          DD_AGENT_HOST=datadog
          DD_SERVICE=cubot-frontend
          DD_ENV=production
          DD_VERSION=$IMAGE_TAG
          EC2_EOF

          # ── Remove any standalone dd-agent container (replaced by compose service) ──
          docker rm -f dd-agent 2>/dev/null || true

          # ── Deploy ────────────────────────────────────────────
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --parallel backend frontend
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

          # ── Reload nginx to pick up any config changes ─────────
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload || true

          # ── Cleanup old images (including old tagged ECR images) ─
          docker image prune -a -f --filter "until=1h"

          echo "Deploy complete: \$(date) — image $IMAGE_TAG"
          RUNNER_EOF

          # Send the script to EC2 via SSM (jq handles JSON escaping of the script content)
          COMMAND_ID=$(aws ssm send-command \
            --instance-id "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 900 \
            --parameters "$(jq -n --rawfile script /tmp/deploy.sh '{commands: [$script]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to finish (30 retries × 30 s = 15 min max)
          AWS_MAX_ATTEMPTS=30 aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          # Print stderr if the command failed
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed ($STATUS) — stderr:"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
