[project]
name = "cubot-sdk"
version = "0.1.0"
description = "Vehicle-side SDK that connects real robots and drones to the CuBot Fleet Planner over VDA 5050 and uav MQTT topics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "aiomqtt>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubot_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
